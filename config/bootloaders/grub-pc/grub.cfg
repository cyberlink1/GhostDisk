# The Debian-signed GRUB binaries have the path of this very configuration file
# (/EFI/debian/grub.cfg) hardcoded. Let's use it instead of adding layers
# of indirection.

function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod efi_gop
    insmod efi_uga
    insmod ieee1275_fb
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}

set linux_gfx_mode=
export linux_gfx_mode
load_video

source /boot/grub/theme.cfg

set grub_dir="/EFI/debian/grub"

# Load background image
insmod gfxterm
insmod png
loadfont unicode
terminal_output gfxterm
background_image ${grub_dir}/splash.png

set default=0
set timeout=4

probe --set rootuuid --fs-uuid ($root)

# Based on the output of `grub-syslinux2cfg /EFI/BOOT/syslinux.cfg`
menuentry 'Ghost Disk' --id 'live' {
	  echo "Loading the Linux kernel..."
	  linux /live/vmlinuz boot=live config nosgx quiet
	  echo "Loading the initramfs..."
	  initrd /live/initrd.img
	  echo "Booting..."
	  boot
}

menuentry "Self-destruct" {
    linux /live/vmlinuz init=/init quiet nosgx target=nuke
    echo "Loading Nuke!"
    initrd /live/initramfs-mini.img
    echo "Nuking it!"
    boot
}

menuentry "Setup" {
    linux /live/vmlinuz init=/init quiet nosgx target=luks
    echo "Loading Setup"
    initrd /live/initramfs-mini.img
    boot
}
