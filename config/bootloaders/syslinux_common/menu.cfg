UI vesamenu.c32
menu hshift 0
menu width 82
APPEND video=1024x768

menu title Boot menu
#MENU MASTER PASSWD --sha-2-512 <hash>
NOESCAPE 1
ALLOWOPTIONS 0
include stdmenu.cfg
include live.cfg
