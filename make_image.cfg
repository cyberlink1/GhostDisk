# =============================================================================
# Live-build configuration file
# -----------------------------------------------------------------------------
# Values sourced by make_image.sh
# =============================================================================

# User account
LIVE_USER="liveuser"
LIVE_PASSWORD="live"

# Root password (for initramfs)
ROOT_PASSWORD="rootpass"

# Desktop selection (xfce or lxqt)
DESKTOP_ENV="lxqt"

# My test system is a hacked chromebook that can operate as a tablet
# As such it needs to auto rotate the screen. This is not a common
# Config so Im making it an option.
AUTO_ROTATE=true

#
# Below here is not implimented yet
#

#
# Require boot password
#
UNLOCK_BOOT=true

#
# Max failed login attempts
#
MAX_FAILED=3

#
# Wipe the persistent storage after max failed logins
#
WIPE_ON_FAIL=true

#
# Crypto options
#   openssl: use openssl for crypto finctions
#   pgp: use pgp for crypto function
#
CRYPTO="openssl"

#
# Validation of boot environtment
#  sha512: validate all /boot files using sha512 hashes baked into securerd
#  signature: cryptographicly sign the initrd and vmlinuz files and validate on boot
#  decryption: encrypt the initrd and vmlinuz files and decrypt on boot
#Multiple selections seperated by pipes
#
VALIDATION="sha512"

#
# Key store options
#
#  JCOP4: use a JCOP4 smart card with SmartPgpApplicaiton on it.
#  AT24C64: Us an AT24C64 EEPROM card with the GhostDisk Layout
#  KEYSTORE: create an encrypted keystore on the securerd image with the keys
#
KEY_STORE=""
